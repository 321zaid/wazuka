<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B3D91" />
    <meta name="description" content="WAZUKA — Beautiful kitchen essentials for everyday life. Glassware, ceramics, cookware and more. Contact us by WhatsApp to order." />
    <title>WAZUKA — Kitchen Essentials for Everyday Life</title>
  </head>
  <body>
    <div id="root"></div>
    <div class="scroll-progress" />
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        const progress = document.querySelector('.scroll-progress');
        if (!progress) return;
        const updateProgress = () => {
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
          const progressWidth = (scrollTop / scrollHeight) * 100;
          progress.style.transform = `translateX(${progressWidth}%)`;
        };
        window.addEventListener('scroll', updateProgress, { passive: true });
        updateProgress();
      })();
    </script>
  </body>
</html>
